name: Refresh profile charts

on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_metrics.py
      - scripts/update_products.py
      - scripts/test_update_products.py
      - .github/workflows/profile-metrics.yml

permissions:
  contents: read

concurrency:
  group: profile-charts
  cancel-in-progress: false

jobs:
  charts:
    if: github.repository == 'archon1999/archon1999'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the profile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Render contribution calendar and Codeforces history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_metrics.py
      - name: Verify public product snapshot behavior
        run: python3 -m unittest discover -s scripts -p test_update_products.py
      - name: Refresh KEP public platform statistics
        run: python3 scripts/update_products.py
      - name: Generate stats card (dark)
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2 renderer
        with:
          card: stats
          options: username=archon1999&bg_color=0D1117&border_color=30363D&title_color=58A6FF&text_color=E6EDF3&icon_color=3FB950&border_radius=6&disable_animations=true&card_width=495&show_icons=true&hide_rank=true&custom_title=GitHub%20statistics
          path: assets/github-stats-dark.svg
          core_version: 2.2.0
          fail_on_error: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate top-langs card (dark)
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2 renderer
        with:
          card: top-langs
          options: username=archon1999&bg_color=0D1117&border_color=30363D&title_color=58A6FF&text_color=E6EDF3&icon_color=3FB950&border_radius=6&disable_animations=true&card_width=495&layout=compact&langs_count=8&size_weight=1&count_weight=0&custom_title=Languages%20in%20public%20repositories
          path: assets/languages-dark.svg
          core_version: 2.2.0
          fail_on_error: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate streak card (dark)
        uses: DenverCoder1/github-readme-streak-stats@adbd07609bb771d3510a15ee2f3b31d5fbe5201d # v1
        with:
          options: user=archon1999&timezone=Asia/Tashkent&disable_animations=true&card_width=1000&border_radius=6&background=0D1117&border=30363D&stroke=30363D&ring=3FB950&fire=3FB950&currStreakNum=E6EDF3&sideNums=E6EDF3&currStreakLabel=3FB950&sideLabels=8B949E&dates=8B949E&date_format=M%20j%2C%20Y
          path: assets/streak-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate stats card (light)
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2 renderer
        with:
          card: stats
          options: username=archon1999&bg_color=FFFFFF&border_color=D1D9E0&title_color=0969DA&text_color=1F2328&icon_color=1A7F37&border_radius=6&disable_animations=true&card_width=495&show_icons=true&hide_rank=true&custom_title=GitHub%20statistics
          path: assets/github-stats-light.svg
          core_version: 2.2.0
          fail_on_error: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate top-langs card (light)
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2 renderer
        with:
          card: top-langs
          options: username=archon1999&bg_color=FFFFFF&border_color=D1D9E0&title_color=0969DA&text_color=1F2328&icon_color=1A7F37&border_radius=6&disable_animations=true&card_width=495&layout=compact&langs_count=8&size_weight=1&count_weight=0&custom_title=Languages%20in%20public%20repositories
          path: assets/languages-light.svg
          core_version: 2.2.0
          fail_on_error: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate streak card (light)
        uses: DenverCoder1/github-readme-streak-stats@adbd07609bb771d3510a15ee2f3b31d5fbe5201d # v1
        with:
          options: user=archon1999&timezone=Asia/Tashkent&disable_animations=true&card_width=1000&border_radius=6&background=FFFFFF&border=D1D9E0&stroke=D1D9E0&ring=1A7F37&fire=1A7F37&currStreakNum=1F2328&sideNums=1F2328&currStreakLabel=1A7F37&sideLabels=59636E&dates=59636E&date_format=M%20j%2C%20Y
          path: assets/streak-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate cards before publishing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for name in ['github-stats', 'languages', 'streak', 'activity', 'codeforces', 'kep-overview']:
              for theme in ['dark', 'light']:
                  path = Path(f'assets/{name}-{theme}.svg')
                  source = path.read_text(encoding='utf-8')
                  root = ET.fromstring(source)
                  assert root.tag.endswith('svg'), f'Invalid SVG: {path}'
                  assert not any(error in source.lower() for error in ['something went wrong', 'could not fetch', 'error fetching']), f'Error card: {path}'
          print('All twelve generated profile cards are valid SVGs.')
          PY
      - name: Save refreshed SVGs
        run: |
          git add assets/*-dark.svg assets/*-light.svg data/metrics.json data/products.json
          if git diff --cached --quiet; then
            echo "The profile charts are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile statistics"
          git push
